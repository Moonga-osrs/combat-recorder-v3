<title>Moonga Combat Replay v3</title><link rel="stylesheet" href="/style.css"><header><h1>Moonga Combat Replay v3</h1><span>Native osrs.world renderer · local file playback</span><label>Recording <input id="recording" type="file" accept=".jsonl,.mcr3"></label><button id="load-world">Load local world cache</button></header><div id="status">Preparing the replay engine…</div><main><div class="player-shell"><section id="viewport"></section><footer><button id="play" disabled>Play</button><input id="timeline" type="range" min="0" max="1" value="0"><span id="clock">0:00</span><select id="camera"><option value="follow">Follow player</option><option value="tile">Orbit tile</option><option value="free">Free camera</option></select></footer></div><aside><h2>Replay information</h2><div id="info">Select a recording. Your file stays in this browser.</div><div id="settings-panel">Load the world cache to open settings.</div><div hidden><label>Render distance <input id="distance" type="range" min="16" max="2000" step="16" value="128"></label><label>FPS limit <select id="fps-limit"><option value="30">30</option><option value="60" selected>60</option><option value="90">90</option><option value="120">120</option><option value="0">Unlimited</option></select></label><details id="replay-settings"><summary>Settings</summary><label title="Show one player per tile. Keep the recorded player; choose a stable random player on other tiles."><input id="hide-stacked-players" type="checkbox"> Hide stacked players</label></details></div><div id="metrics"></div></aside></main><script type="module" src="/app.js"></script></html>
