plugins { id 'java' }
group = 'tv.moonga'
version = '0.1.0'
repositories {
    maven { url = 'https://repo.runelite.net'; content { includeGroupByRegex('net\\.runelite.*') } }
    mavenCentral()
}
tasks.withType(JavaCompile).configureEach { options.release.set(11); options.encoding = 'UTF-8' }
dependencies {
    compileOnly 'net.runelite:client:latest.release'
    compileOnly 'com.google.code.gson:gson:2.13.2'
    testImplementation 'net.runelite:client:latest.release'
    testImplementation 'com.google.code.gson:gson:2.13.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}
tasks.withType(Test).configureEach { systemProperty 'java.awt.headless', 'true' }

tasks.register('run', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'tv.moonga.recorder.v3.RecorderDevelopment'
 args '--developer-mode', '--debug'
}
